name: Validate

# There's no automated deploy pipeline (production ships via a manual
# VPS deploy script) — this workflow exists purely as a safety net so
# schema/sitemap/type regressions are caught on every push and PR
# instead of being discovered later via Google Search Console.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SEO/schema validation
        run: npm run validate-seo

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
